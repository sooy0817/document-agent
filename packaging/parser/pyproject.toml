[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nh-document-parser"
version = "0.1.2"
description = "Parse PDFs into ordered text and tables with source-backed row and column paths"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24.11,<2", "pydantic>=2.9,<3"]

[project.optional-dependencies]
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]

[project.scripts]
nh-parse = "nh_document_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nh_document_parser = ["clean-document.schema.json"]
