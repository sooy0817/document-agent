<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문서 이해 실험 기록부</title>
<style>
:root{--ink:#193a31;--muted:#53685f;--line:#cad8d1;--bg:#f2f6f3;--accent:#176650}*{box-sizing:border-box}body{font:16px/1.65 system-ui;margin:0;background:var(--bg);color:var(--ink)}header{padding:24px 32px;background:white;border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px}h2{font-size:22px}h3{font-size:18px}p{margin:8px 0}a{color:var(--accent)}button,input,select,textarea{font:inherit;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:white}button{cursor:pointer}button.active{color:white;background:var(--accent)}button:hover{border-color:var(--accent)}:focus-visible{outline:3px solid #286bc1;outline-offset:2px}label{display:block;font-weight:600;margin:12px 0 5px}textarea{width:100%;min-height:100px}nav{display:flex;gap:10px;padding:14px 32px;flex-wrap:wrap}main{padding:0 32px 32px;max-width:1700px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}.stats{display:flex;gap:20px;flex-wrap:wrap}.stats strong{font-size:24px}.notice{padding:14px;background:#fff4dd;border-left:4px solid #a96a08}.paths{white-space:pre-wrap;overflow-wrap:anywhere}.compare{border-left:4px solid var(--accent);padding:12px;background:#f1f6f3}svg,img{width:100%;height:auto}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}small{color:var(--muted);font-size:14px}#status{min-height:28px}details{margin:12px 0}summary{cursor:pointer}select{max-width:100%}@media(max-width:950px){.grid{grid-template-columns:1fr}header,nav{padding:16px}main{padding:0 16px 20px}}
</style>
<header><h1>문서 이해 실험 기록부</h1><p>테스트 결과와 사람의 검토를 별도로 쌓습니다. 이전 결과와 원본은 덮어쓰지 않습니다.</p><div id="stats" class="stats"></div><div id="status" role="status"></div></header>
<nav aria-label="기록부 메뉴"><button data-tab="review">내가 확인할 정답</button><button data-tab="runs">누적 테스트 기록</button><button data-tab="plan">현재 구조와 다음 계획</button></nav><main id="main"></main>
<script>
const D=__DATA__,E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='review',pos=0,draft={reviewer:'',reviews:{}},storageKey='evaluation-review-'+D.queue_sha256;
try{draft=JSON.parse(localStorage.getItem(storageKey)||JSON.stringify(draft))}catch(e){}
const confirmed={};D.review_events.sort((a,b)=>a.imported_at.localeCompare(b.imported_at)).forEach(ev=>{if(ev.review.queue_sha256===D.queue_sha256)ev.review.reviews.forEach(r=>confirmed[r.case_id]=r)});
function feedback(s){document.querySelector('#status').textContent=s}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(draft));feedback('브라우저 초안 저장됨 · JSON 내보내기 후 파일을 전달해야 기록부에 정식 등록됩니다.')}catch(e){feedback('브라우저 저장 실패 · JSON으로 내보내 주세요.')}stats()}
function stats(){document.querySelector('#stats').innerHTML=`<span><strong>${D.runs.length}</strong> 실행 기록</span><span><strong>${D.queue.cases.length}</strong> 확인할 항목</span><span><strong>${Object.keys(confirmed).length}</strong> 정식 검토 기록</span><span><strong>${Object.values(draft.reviews).filter(x=>x.decision).length}</strong> 브라우저 초안</span>`}
function output(){if(!draft.reviewer.trim()){feedback('검토자 이름 또는 이니셜을 입력해 주세요.');return}const reviews=Object.entries(draft.reviews).filter(([k,v])=>v.decision).map(([k,v])=>({case_id:k,decision:v.decision,note:v.note||''}));if(!reviews.length){feedback('내보낼 판정이 없습니다.');return}if(reviews.some(r=>r.decision==='correction'&&!r.note.trim())){feedback('수정 필요 항목에는 수정할 내용을 적어 주세요.');return}const value={schema_version:'evaluation-review/1.0',queue_sha256:D.queue_sha256,reviewer:draft.reviewer,reviews};let u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='evaluation-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);feedback('검토 JSON 다운로드를 요청했습니다. 파일을 전달하면 원본을 바꾸지 않고 검토 이력으로 등록합니다.')}
function render(){stats();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render()}});const main=document.querySelector('#main');
if(tab==='runs'){main.innerHTML=`<div class="notice">기하 검사 통과, 후보 경로 일치, 산술 일치는 서로 다른 결과입니다. 미실행·미검증 정확도는 N/A로 유지합니다. 등록 시각은 과거 실험 실행 시각과 다릅니다.</div><div class="card scroll"><table><thead><tr><th>실험</th><th>구분</th><th>평가 범위</th><th>보존 결과</th></tr></thead><tbody>${D.runs.map(r=>`<tr><td>${E(r.title)}<br><small>등록 ${E(r.recorded_at)}</small></td><td>${E(r.dataset_role)}<br>${E(r.result_kind)}</td><td>${E(r.metadata.scope||('전체 '+r.metadata.pages+'p / Native '+r.metadata.native_pages+'p / 평가 '+r.metadata.evaluated_pages?.join(', ')))}</td><td><a href="runs/${r.run_id}.json">실행 기록</a><details><summary>결과 스냅샷 ${Object.keys(r.artifacts).length}개</summary>${Object.entries(r.artifacts).map(([p,h])=>`<p><a href="objects/${h}">${E(p.split('/').pop())}</a></p>`).join('')}</details></td></tr>`).join('')}</tbody></table></div>`;return}
if(tab==='plan'){main.innerHTML=`<section class="card"><h2>현재 처리 구조</h2><p>원본 PDF → 문자·좌표 추출 → 셀·경계·병합 복원 → 행·열 Tree 후보 → Rule 및 기존 LLM 응답 기반 의미 후보 → ID 연결·검증 → 별도 결과 저장</p><p>여기에 <b>합계 검산 → 사람 검토 → 정답 개정 → 재평가</b>가 이어집니다. 새 LLM 호출, OCR, DB 적재와 확정 Fact 발행은 현재 실행하지 않습니다.</p></section><section class="card"><h2>먼저 개선할 부분</h2><ol><li>금액 셀 대응 및 독립 비율 행: 남원에 남은 4개를 먼저 확인합니다.</li><li>잘못된 부모의 격리와 정상 루트를 구별합니다. 기권을 정답으로 계산하지 않습니다.</li><li>복수 항목명 열과 좌우 병렬표를 지원합니다. 현재 단일 열 수정은 이 경우 기권합니다.</li><li>페이지 번호 상자 같은 오탐을 줄입니다.</li><li>스캔 문서는 OCR 준비 이후 별도 평가합니다.</li></ol></section><section class="card"><h2>자동 검증 확장 계획</h2><p>소계·합계 → 기초 + 증가 − 감소 = 기말 → 당기 − 전기 = 증감 → 분모가 확인된 비율 순으로 확장합니다. 기간·단위·범위가 확인된 경우에만 계산합니다.</p><p>숫자가 맞는 범위를 무작정 찾아 정답으로 만들지 않습니다. 구조로 제한한 후보를 검산하고, 여러 범위가 맞거나 0 항목 포함 여부가 불분명하면 사람 검토로 보냅니다.</p><a href="../../docs/EVALUATION_OPERATIONS_PLAN.md">운영 방식과 단계별 계획 읽기</a></section>`;return}
const c=D.queue.cases[pos],v=draft.reviews[c.case_id]||{decision:'',note:''};
const picture=c.viewbox?`<svg role="img" aria-label="원본 표와 확인할 셀" viewBox="${c.viewbox[0]-4} ${c.viewbox[1]-4} ${c.viewbox[2]-c.viewbox[0]+8} ${c.viewbox[3]-c.viewbox[1]+8}"><image href="${c.image}" width="595.32" height="841.92"/>${c.highlight?`<rect x="${c.highlight[0]}" y="${c.highlight[1]}" width="${c.highlight[2]-c.highlight[0]}" height="${c.highlight[3]-c.highlight[1]}" fill="#dda40022" stroke="#ac6600" stroke-width="1.5"/>`:''}</svg>`:`<img src="${c.image}" alt="운주 원본 표의 물리 셀 오버레이">`;
main.innerHTML=`<div class="card"><label for="who">검토자 이름 또는 이니셜</label><input id="who" value="${E(draft.reviewer)}"><button id="export">검토 JSON 내보내기</button><label for="load">이전에 내보낸 검토 JSON 불러오기</label><input id="load" type="file" accept="application/json"><p><small>브라우저 초안은 정답지에 자동 반영되지 않습니다. 이미 검토한 전체 Tree를 다시 승인하는 요청도 아닙니다.</small></p></div><label for="case">확인할 사례 선택</label><select id="case">${D.queue.cases.map((x,i)=>`<option value="${i}" ${i===pos?'selected':''}>${i+1}. ${E(x.title)} ${draft.reviews[x.case_id]?.decision?'· 초안 있음':''}</option>`).join('')}</select><h2>${E(c.title)}</h2><div class="notice"><b>확인할 질문</b><p>${E(c.question)}</p></div><div class="grid"><section class="card"><h3>원본 근거</h3>${picture}<a href="${c.image}" target="_blank">큰 이미지로 열기</a></section><section class="card"><h3>정답 기준 또는 확인할 제안</h3><div class="compare paths">${E(c.expected)}</div><h3>현재 결과 또는 원문 합계</h3><div class="paths">${E(c.predicted)}</div><label for="decision">판정</label><select id="decision"><option value="">선택해 주세요</option><option value="agree">제시한 판단·범위에 동의</option><option value="correction">수정 필요</option><option value="uncertain">판단 보류</option></select><label for="note">수정할 내용 또는 판단 근거</label><textarea id="note">${E(v.note)}</textarea><p><small>수정 필요를 선택하면 내용을 적어 주세요. 동의는 이 항목의 범위에만 적용됩니다.</small></p><button id="previous">이전</button> <button id="next">다음</button><details><summary>추적 정보</summary><p class="paths">${E(c.source_cell)}</p><p>원본 근거 해시: ${E(c.source_artifact_sha256)}</p></details></section></div>`;
document.querySelector('#who').oninput=e=>{draft.reviewer=e.target.value;save()};document.querySelector('#export').onclick=output;
document.querySelector('#case').onchange=e=>{pos=Number(e.target.value);render()};const dec=document.querySelector('#decision'),note=document.querySelector('#note');dec.value=v.decision;function change(){draft.reviews[c.case_id]={decision:dec.value,note:note.value};save()}dec.onchange=change;note.oninput=change;
document.querySelector('#previous').onclick=()=>{pos=Math.max(0,pos-1);render()};document.querySelector('#next').onclick=()=>{pos=Math.min(D.queue.cases.length-1,pos+1);render()};
document.querySelector('#load').onchange=async e=>{try{const b=JSON.parse(await e.target.files[0].text()),ids=new Set(D.queue.cases.map(c=>c.case_id)),seen=new Set();if(b.schema_version!=='evaluation-review/1.0'||b.queue_sha256!==D.queue_sha256||typeof b.reviewer!=='string'||!Array.isArray(b.reviews))throw Error('schema');for(const r of b.reviews){if(!ids.has(r.case_id)||seen.has(r.case_id)||!['agree','correction','uncertain'].includes(r.decision)||typeof r.note!=='string')throw Error('case');seen.add(r.case_id)}draft.reviewer=b.reviewer;b.reviews.forEach(r=>draft.reviews[r.case_id]={decision:r.decision,note:r.note});save();render();feedback('초안으로 불러왔습니다. 정식 검토 이력 등록은 파일 전달 후 별도로 수행합니다.')}catch(err){feedback('불러오기 실패: 이 검토 묶음의 JSON인지 확인해 주세요.')}};
}
render();
</script></html>
