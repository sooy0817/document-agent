<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>남원 셀 경로 오류 검토</title>
<style>
:root{--ink:#18372e;--line:#cad9d2;--bg:#f2f6f3;--accent:#176650}*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui;color:var(--ink);background:var(--bg)}header{padding:20px 28px;background:white;border-bottom:1px solid var(--line)}h1{font-size:26px;margin:0}p{margin:8px 0}button,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}button{cursor:pointer;min-height:44px}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2e77cf}button.active{background:var(--accent);color:white}.layout{display:grid;grid-template-columns:240px minmax(0,1fr)}nav{padding:18px;max-height:85vh;overflow:auto;position:sticky;top:0}nav button{width:100%;text-align:left;margin:4px 0}main{padding:24px;min-width:0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;padding:20px;border:1px solid var(--line);border-radius:10px;margin-bottom:16px}svg{width:100%;height:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.scroll{overflow:auto}textarea{display:block;width:100%;min-height:90px}label{display:block;font-weight:600;margin:12px 0 6px}.notice{border-left:4px solid #bc790b;padding:12px;background:#fff6e3}small{font-size:14px}#feedback{min-height:26px}a{color:var(--accent)}@media(max-width:1000px){.compare{grid-template-columns:1fr}.layout{grid-template-columns:1fr}nav{position:static;max-height:220px}}
</style>
<header><h1>60개 불일치에서 판단할 부분만 확인하기</h1><p>남원 개발셋 · 원본과 기존 정답은 변경하지 않았습니다. 같은 원인의 셀은 묶었습니다.</p><button id="export">검토 결과 JSON 내보내기</button> <span id="progress"></span><div id="feedback" role="status"></div></header>
<div class="layout"><nav aria-label="검토 사례" id="nav"></nav><main id="main"></main></div>
<script>
const data=__DATA__, key='namwon-tree-triage-'+JSON.stringify(data.input_sha256);let saved={},selected=0;
try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){document.querySelector('#feedback').textContent='브라우저 저장을 사용할 수 없습니다. JSON으로 내보내 주세요.'}
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const path=p=>p.length?p.map(esc).join(' → '):'연결 없음';
function render(){const c=data.cases[selected];document.querySelector('#progress').textContent=`${Object.values(saved).filter(x=>x.decision).length} / ${data.case_count}개 묶음 검토`;
document.querySelector('#nav').innerHTML=data.cases.map((x,i)=>`<button class="${i===selected?'active':''}" data-i="${i}">p${x.page} · ${x.members.length}셀<br>${esc(x.category_label)}<br><small>${saved[x.id]?.decision?'검토 기록 있음':'미검토'}</small></button>`).join('');
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);render()});
const [x,y,x1,y1]=c.table_bbox,rect=b=>`<rect x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}" fill="#e0a02022" stroke="#ad6900" stroke-width="1"/>`;
const blue=c.amount_evidence.map(a=>{let b=a.bbox;return `<rect x="${b.x0}" y="${b.y0}" width="${b.x1-b.x0}" height="${b.y1-b.y0}" fill="none" stroke="#1261bc" stroke-width="2"/>`}).join('');
document.querySelector('#main').innerHTML=`<h2>${esc(c.id)} · p${c.page} · ${esc(c.category_label)}</h2><div class="notice"><strong>확인할 내용</strong><p>${esc(c.question)}</p><small>진단은 검토 후보입니다. 근거 부족이면 보류를 선택하세요.</small></div><div class="compare"><section class="card"><h3>원본 표</h3><p>주황 테두리: 평가 대상 셀 영역 / 파랑: 실제 금액 셀</p><svg role="img" aria-label="원본 표와 비교 셀" viewBox="${x-4} ${y-6} ${x1-x+8} ${y1-y+12}"><image href="../rag-phase3/review/p${c.page}.png" width="595.32" height="841.92"/>${c.members.map(m=>rect(m.bbox)).join('')}${blue}</svg><a href="../rag-phase3/review/p${c.page}.png" target="_blank">전체 원본 페이지 보기</a></section><section class="card"><h3>정답 기준과 자동 결과</h3><div class="scroll"><table><thead><tr><th>원문 값</th><th>정답 기준 경로</th><th>자동 결과 경로</th></tr></thead><tbody>${c.members.map(m=>`<tr><td>${esc(m.raw_value)||'(빈칸)'}</td><td>행: ${path(m.expected_labels.row)}<br>열: ${path(m.expected_labels.column)}</td><td>행: ${path(m.predicted_labels.row)}<br>열: ${path(m.predicted_labels.column)}</td></tr>`).join('')}</tbody></table></div><label for="decision">이 진단에 대한 판단</label><select id="decision"><option value="">아직 판단하지 않음</option><option>진단에 동의</option><option>정답 기준 수정 필요</option><option>진단 수정 필요</option><option>보류</option></select><label for="note">수정할 내용 또는 판단 근거</label><textarea id="note"></textarea><p><small>브라우저에 임시 저장합니다. 내보낸 파일을 전달하기 전에는 정답이나 알고리즘에 반영되지 않습니다.</small></p><button id="next">다음 사례</button></section></div>`;
const d=document.querySelector('#decision'),n=document.querySelector('#note');d.value=saved[c.id]?.decision||'';n.value=saved[c.id]?.note||'';
function save(){saved[c.id]={decision:d.value,note:n.value,updated_at:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(saved));document.querySelector('#feedback').textContent='브라우저에 임시 저장했습니다.'}catch(e){document.querySelector('#feedback').textContent='저장 실패. JSON 내보내기로 보관하세요.'}document.querySelector('#progress').textContent=`${Object.values(saved).filter(x=>x.decision).length} / ${data.case_count}개 묶음 검토`}
d.onchange=save;n.oninput=save;document.querySelector('#next').onclick=()=>{selected=(selected+1)%data.cases.length;render()};}
document.querySelector('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({dataset:data.dataset,input_sha256:data.input_sha256,reviews:saved},null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='namwon-tree-triage-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);document.querySelector('#feedback').textContent='検토 결과 내보내기를 요청했습니다. 다운로드 파일을 확인해 주세요.'.replace('検','검')};render();
</script></html>
