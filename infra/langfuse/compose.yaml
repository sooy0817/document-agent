name: nh-rag-observability

x-common: &common
  DATABASE_URL: postgresql://langfuse:${LF_DB_PASSWORD}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:3008
  SALT: ${LF_SALT}
  ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: 'false'
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
  LANGFUSE_IN_APP_AGENT_ENABLED: 'false'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${LF_REDIS_PASSWORD}
  REDIS_TLS_ENABLED: 'false'
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9098
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'

x-depends: &depends
  postgres:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *depends
    ports: ['127.0.0.1:3008:3000']
    environment:
      <<: *common
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: nh-local-demo
      LANGFUSE_INIT_ORG_NAME: NH Local Demo
      LANGFUSE_INIT_PROJECT_ID: nh-table-rag
      LANGFUSE_INIT_PROJECT_NAME: NH Multi-Source Table RAG
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: demo@nh.local
      LANGFUSE_INIT_USER_NAME: NH Demo
      LANGFUSE_INIT_USER_PASSWORD: ${LF_LOGIN_PASSWORD}
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: *depends
    environment: *common
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LF_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes: ['lf_postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse -d langfuse']
      interval: 5s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD}
    volumes: ['lf_clickhouse:/var/lib/clickhouse', 'lf_clickhouse_logs:/var/log/clickhouse-server']
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LF_MINIO_PASSWORD}
    ports: ['127.0.0.1:9098:9000']
    volumes: ['lf_minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${LF_REDIS_PASSWORD}', '--maxmemory-policy', 'noeviction']
    volumes: ['lf_redis:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$LF_REDIS_PASSWORD redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      LF_REDIS_PASSWORD: ${LF_REDIS_PASSWORD}

volumes:
  lf_postgres:
  lf_clickhouse:
  lf_clickhouse_logs:
  lf_minio:
  lf_redis:
